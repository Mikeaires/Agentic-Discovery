[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-discovery"
version = "0.2.0"
description = "An agent that interviews people to discover knowledge, driven by a knowledge graph."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
discovery = "agentic_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_discovery*"]

[tool.setuptools.package-data]
agentic_discovery = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
